// ============================================================
// RENDER LOGIC
// ============================================================
const params = new URLSearchParams(window.location.search);
let currentSubject = params.get('subject') || 'mathematics';
let currentTopicId = params.get('topic') || null;

const topicListEl     = document.getElementById('topic-list');
const contentEl       = document.getElementById('lesson-content-area');
const subjectSwitcher = document.getElementById('subject-switcher');

subjectSwitcher.value = currentSubject;

function renderSidebar(subject) {
  const data = lessonData[subject];
  if (!data) { topicListEl.innerHTML = '<p style="padding:1rem;color:var(--text-light);font-size:0.875rem;">Content coming soon!</p>'; return; }

  topicListEl.innerHTML = data.sections.map(sec => `
    <div class="topic-section-label">${sec.label}</div>
    ${sec.topics.map(t => `
      <div class="topic-item ${t.id === (currentTopicId || data.sections[0].topics[0].id) ? 'active' : ''}"
           data-topic="${t.id}" data-subject="${subject}">
        <span>${t.title}</span>
        ${t.done ? '<span class="done">✓</span>' : ''}
      </div>
    `).join('')}
  `).join('');

  topicListEl.querySelectorAll('.topic-item').forEach(item => {
    item.addEventListener('click', () => {
      topicListEl.querySelectorAll('.topic-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      loadTopic(item.dataset.subject, item.dataset.topic);
    });
  });
}

function loadTopic(subject, topicId) {
  currentTopicId = topicId;
  const data = lessonData[subject];
  if (!data) { contentEl.innerHTML = '<div class="lesson-main" style="padding:3rem;color:var(--text-light);text-align:center;"><h2>Content coming soon!</h2><p>We\'re working hard to add this subject. Check back soon!</p></div>'; return; }

  let found = null;
  for (const sec of data.sections) {
    const t = sec.topics.find(t => t.id === topicId);
    if (t) { found = t; break; }
  }
  if (!found) return;

  contentEl.innerHTML = `
    <div>
      ${found.content}
      <div class="take-quiz-bar">
        <div>
          <h4>Ready to test yourself? 💪</h4>
          <p>Take a practice quiz on this topic and track your score.</p>
        </div>
        <a href="practice.html?subject=${subject}&topic=${topicId}&type=practice" class="btn btn-accent">
          📝 Take Quiz →
        </a>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function init(subject) {
  renderSidebar(subject);
  const data = lessonData[subject];
  if (!data) { contentEl.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--text-light)"><h2>Content Coming Soon!</h2><p>We\'re adding this subject shortly.</p><a href="subjects.html" class="btn btn-outline" style="margin-top:1rem;">← Back to Subjects</a></div>'; return; }
  const firstTopic = currentTopicId || data.sections[0].topics[0].id;
  loadTopic(subject, firstTopic);
}

subjectSwitcher.addEventListener('change', (e) => {
  currentSubject = e.target.value;
  currentTopicId = null;
  history.pushState(null, '', `learn.html?subject=${currentSubject}`);
  init(currentSubject);
});

init(currentSubject);
</script>
